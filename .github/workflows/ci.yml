name: CI

on:
  push:
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e ".[dev]"
      # e2e（tests/e2e/）默认 skip：需要真实登录与网络，不进入常规 CI
      # （判定矩阵与 gating 开关见 doc/e2e_test_design.md）。
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy chatgpt_web
      - name: Pytest
        run: pytest -q
